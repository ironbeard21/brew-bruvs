name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:licenses
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: brew-math-coverage
          path: packages/brew-math/coverage
