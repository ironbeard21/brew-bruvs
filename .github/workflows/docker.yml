name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BREW_BRUVS_IMAGE: brew-bruvs:smoke
      POSTGRES_PASSWORD: smoke-test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: docker compose -f docker/compose.yml build app
      - run: docker compose -f docker/compose.yml up -d --no-build --wait --wait-timeout 120
      - name: Check the startup catalog
        run: |
          count=$(docker compose -f docker/compose.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U brew -d brew -Atc "SELECT count(*) FROM hops WHERE id = 'hop-columbus' AND 'Zeus' = ANY(aliases)")
          test "$count" -eq 1
      - run: node scripts/docker-smoke.ts
      - if: failure()
        run: docker compose -f docker/compose.yml logs
      - if: always()
        run: docker compose -f docker/compose.yml down --volumes

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: brew-bruvs-e2e
      BREW_BRUVS_IMAGE: brew-bruvs:e2e
      POSTGRES_PASSWORD: e2e-test-only
      BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brew-bruvs/app exec playwright install --with-deps chromium
      - run: docker compose -f docker/compose.yml build app
      - run: docker compose -f docker/compose.yml up -d --no-build --wait --wait-timeout 120
      - name: Assert the catalog was seeded on startup
        run: |
          count=$(docker compose -f docker/compose.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U brew -d brew -Atc "SELECT count(*) FROM hops WHERE id = 'hop-columbus' AND 'Zeus' = ANY(aliases)")
          test "$count" -eq 1
      - name: Run Playwright against Compose
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure
          path: apps/app/test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f docker/compose.yml logs --no-color
      - if: always()
        run: docker compose -f docker/compose.yml down --volumes

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
