services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: brew
      POSTGRES_DB: brew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -U, brew, -d, brew]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-dev:
